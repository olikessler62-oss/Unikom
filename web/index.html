<!doctype html>
<!--
      Ein Erscheinungsbild, und es ist dunkel.

      Der Haken steht fest im Markup und wird nirgends umgeschaltet. Er trägt
      trotzdem den Namen der Spec, damit jedes Rezept von dort unverändert
      passt - und er steht hier und nicht im Bündel, damit beim Laden nicht
      einen Wimpernschlag lang eine weiße Seite aufblitzt.
    -->
<html lang="de" data-sw-modern="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unikom</title>
    <!--
      Die Sprache wird gesetzt, bevor irgendetwas gezeichnet wird. Täte das erst
      die Anwendung, stünde das Dokument bis zum ersten Bild in der falschen
      Sprache da. Dieses Stück Code muss deshalb hier stehen und nicht im Bündel
      - und es fällt still aus, wenn der Speicher gesperrt ist.
    -->
    <script>
      try {
        var l = window.localStorage.getItem('unikom.language');
        if (l) document.documentElement.lang = l;
      } catch (e) {
        /* Ohne Speicher bleibt die Sprache aus dem Markup stehen. */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
